name: Java CI with Gradle
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Prepare verified SSVM runtime
        run: bash scripts/prepare-test-jdk.sh
      - name: Build, test and inventory
        run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2 --console=plain
          --dependency-verification strict --continue
          :modasm:test :stdlib:test :ir:test :pure-analysis:test :obfuscator:test :client-standalone:test
          :integration:jar :integration:writeClasspath :integration:copyDecompiler generateSbom
      - name: Audit runtime dependencies
        run: python3 scripts/audit-dependencies.py build/reports/sbom.cdx.json build/reports/dependency-audit.json
      - name: Check protection controls and signatures
        run: |
          python3 scripts/test-reliability.py
          python3 scripts/test-signing.py
          python3 scripts/test-audit.py
          python3 scripts/test-main-download.py
          bash scripts/smoke-test.sh
      - name: Framework, differential and native integration
        env:
          EVALUATE_PROTECTION: '1'
        run: bash scripts/framework-tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            **/build/reports/
          if-no-files-found: error
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: bash scripts/prepare-test-jdk.sh
      - run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict :client-standalone:shadowJar
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Verify target JVM compatibility
        env:
          TARGET_RELEASE: ${{ matrix.java }}
        run: |
          target_home="$JAVA_HOME"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 scripts/compatibility-tests.py "$target_home" "$TARGET_RELEASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-java-${{ matrix.java }}
          path: build/reports/
          if-no-files-found: error
  distribution:
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Package after every validation job passes
        run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict generateSbom
      - name: Prepare verified download bundle
        run: >-
          python3 scripts/main-download.py bundle
          --jar dev.skidfuscator.client.standalone/build/libs/client-standalone-all.jar
          --sbom build/reports/sbom.cdx.json --output build/distribution
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-distribution
          path: build/distribution/
          if-no-files-found: error
  verify-download:
    needs: distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distribution
          path: build/download
      - name: Validate downloaded bytes and preview publication without writing
        run: |
          python3 scripts/main-download.py verify build/download
          python3 scripts/main-download.py publish build/download --dry-run \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME"
  publish-main:
    needs: verify-download
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: main-build-download-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-distribution
          path: build/download
      - name: Update the approved default-branch prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/main-download.py publish build/download
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --branch "$GITHUB_REF_NAME"
