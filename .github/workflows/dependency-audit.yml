name: Scheduled runtime dependency audit
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict generateSbom
      - run: python3 scripts/audit-dependencies.py build/reports/sbom.cdx.json build/reports/dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduled-audit
          path: build/reports/
          if-no-files-found: error
