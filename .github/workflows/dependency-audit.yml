name: Scheduled runtime dependency audit
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: ./gradlew --no-daemon --max-workers=2 --dependency-verification strict generateSbom
      - run: python3 scripts/audit-dependencies.py build/reports/sbom.cdx.json build/reports/dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-audit
          path: build/reports/
          if-no-files-found: error
