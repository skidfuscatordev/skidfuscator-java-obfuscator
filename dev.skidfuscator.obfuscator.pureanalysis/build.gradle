plugins {
    id 'java-library'
}

group = 'dev.skidfuscator.community'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    api project(':modasm')
    // Immutable revision behind the previously used 1.0.0-SNAPSHOT tag.
    api 'io.github.terminalsin:SSVM:0d4fc5417a8a21b58dcd29849dac013aa00b4817'
    //api 'dev.xdark:ssvm-core:2.0.2'
    //api 'dev.xdark:ssvm-invoke:2.0.2'
    //api 'dev.xdark:ssvm-io:2.0.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
