import org.gradle.api.JavaVersion
import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'java'
    id 'java-library'
}

// The runtime constant also versions every distribution module and its manifest.
def skidfuscatorVersion = (file('dev.skidfuscator.obfuscator/src/main/java/dev/skidfuscator/obfuscator/Skidfuscator.java').text
        =~ /public static final String VERSION = "([^"]+)"/)[0][1]

allprojects {
    version = skidfuscatorVersion
    repositories {
        mavenCentral()
        maven {
            url 'https://repo.cleanroommc.com/releases/'
        }
        maven {
            url 'https://jitpack.io'
        }
    }

    apply plugin: 'java-library'

    dependencyLocking {
        lockAllConfigurations()
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.withType(Jar).configureEach {
        manifest.attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version.toString())
    }

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    configurations.configureEach { exclude group: 'log4j', module: 'log4j' }
    dependencies {
        constraints {
            api 'org.slf4j:slf4j-api:2.0.20'
            api 'ch.qos.logback:logback-classic:1.5.38'
            api 'ch.qos.logback:logback-core:1.5.38'
            api 'com.google.guava:guava:33.8.0-jre'
            api 'org.apache.commons:commons-lang3:3.22.0'
        }
        compileOnly 'org.projectlombok:lombok:1.18.36'
        annotationProcessor 'org.projectlombok:lombok:1.18.36'

        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
    }

    compileJava {
        options.encoding = "UTF-8" // Will fail on the non-ascii comments if not set
    }

    tasks.withType(JavaCompile).configureEach {
        if (sourceCompatibility == JavaVersion.VERSION_17) {
            options.compilerArgs += [
                '--add-exports', 'java.base/jdk.internal.reflect=ALL-UNNAMED',
                '--add-exports', 'java.base/jdk.internal.util=ALL-UNNAMED',
                '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'
        ]
        }
    }
    tasks.withType(Test).configureEach {
        if (sourceCompatibility == JavaVersion.VERSION_17) {
            jvmArgs += [
                '--add-exports', 'java.base/jdk.internal.reflect=ALL-UNNAMED',
                '--add-exports', 'java.base/jdk.internal.util=ALL-UNNAMED',
                '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'
        ]
        }
    }


    ext {
        asm = 'org.ow2.asm:asm:9.10.1'
        asm_commons = 'org.ow2.asm:asm-commons:9.10.1'
        asm_tree = 'org.ow2.asm:asm-tree:9.10.1'
        cafedude = 'com.github.Col-E:CAFED00D:2.6.7'
        slf4j_api = 'org.slf4j:slf4j-api:1.7.36'
        jlinker = 'com.github.xxDark:jlinker:3.0.1'
    }
}

group 'dev.skidfuscator.community'

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
}

test {
    useJUnitPlatform()
}

apply from: 'scripts/sbom.gradle'
